# .mission/PROFILE.yaml — written at Intake, re-checked at every gate. Diff between versions → DECISIONS.md.
# Vocabulary: skills/mission/references/shapes-and-scope.md and conventions.md §5.
mission: <short-slug>
direction: "<the user's direction, verbatim>"
updated: <YYYY-MM-DDTHH:MMZ>
mode: interactive            # interactive | autonomous
profile: standard            # standard | lean | degraded

primary_shape: <GRN|FEA|BUG|MIG|REF|UPG|DAT|PRF|INF|SEC|WEB|RSR|OPS>
secondary_shapes: []         # at most 2, in CMP-2 order
gate_zero: <e.g. REPRODUCED | CONTRACT-FROZEN | PARITY-BASELINE | CONVENTIONS-MAPPED | CLAIMS-SOURCED>

class:
  scores:
    breadth: <0-3>
    duration: <0-3>
    uncertainty: <0-3>
    coordination: <0-3>
  result: <S|M|L|XL>
  justification: "<one line: base = max(breadth, duration); +1 if uncertainty or coordination = 3>"

traits:                      # present | absent | unknown — evidence required for present/absent
  existing_codebase:        { value: <present|absent|unknown>, evidence: "<file:line | prompt quote | probe output>", confidence: <high|medium|low> }
  no_test_harness:          { value: unknown, evidence: "", confidence: low }
  has_web_frontend:         { value: unknown, evidence: "", confidence: low }
  has_ios:                  { value: unknown, evidence: "", confidence: low }
  has_android:              { value: unknown, evidence: "", confidence: low }
  multi_platform:           { value: unknown, evidence: "", confidence: low }
  has_backend_api:          { value: unknown, evidence: "", confidence: low }
  published_api:            { value: unknown, evidence: "", confidence: low }
  has_database:             { value: unknown, evidence: "", confidence: low }
  data_migration:           { value: unknown, evidence: "", confidence: low }
  concurrency_or_distributed_state: { value: unknown, evidence: "", confidence: low }
  third_party_integrations: { value: unknown, evidence: "", confidence: low }
  touches_auth:             { value: unknown, evidence: "", confidence: low }
  touches_payments:         { value: unknown, evidence: "", confidence: low }
  touches_pii:              { value: unknown, evidence: "", confidence: low }
  has_ai_llm_features:      { value: unknown, evidence: "", confidence: low }
  public_facing_content:    { value: unknown, evidence: "", confidence: low }
  needs_external_research:  { value: unknown, evidence: "", confidence: low }
  performance_sensitive:    { value: unknown, evidence: "", confidence: low }
  cross_repo_migration:     { value: unknown, evidence: "", confidence: low }
  deploy_to_production:     { value: unknown, evidence: "", confidence: low }
  infra_or_ci_changes:      { value: unknown, evidence: "", confidence: low }
  classifier_sensitive_domain: { value: unknown, evidence: "", confidence: low }
  long_running:             { value: unknown, evidence: "", confidence: low }
  unattended:               { value: unknown, evidence: "", confidence: low }
  design_quality_matters:   { value: unknown, evidence: "", confidence: low }
  localized:                { value: unknown, evidence: "", confidence: low }
  live_incident:            { value: unknown, evidence: "", confidence: low }

obligations: []              # e.g. [MP-1, MP-2, IO-1, IO-3, AU-2, AU-3, PI-1, AI-1, DP-4]; each appears in PLAN.md
waived_obligations: []       # [{ id: <ID>, decision: D-NNN, reason: "<why>" }]

forking_questions:           # ≤3 per round, ≤2 rounds; multiple choice with a default
  - id: <Q-intake-1>
    question: "<question>"
    options: ["<a>", "<b>", "<c>"]
    default: "<recommended option>"
    forks: "<which field this changes: shape | class | trait | platform set>"
    answer: <pending | "<answer>" | ASSUMED (unconfirmed)>

second_opinion:              # L/XL only: blind mission-reviewer profile
  run: <yes|no>
  disagreements: []          # [{ field: <name>, ours: <x>, theirs: <y>, resolution: "<how>" }]

reclassification_log: []     # [{ date: <date>, trigger: "<trigger>", change: "<old → new>", decision: D-NNN }]
