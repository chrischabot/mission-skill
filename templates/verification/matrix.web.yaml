# Screenshot matrix — web
# Template: skills/mission/templates/verification/matrix.web.yaml → .mission/verification/matrix.yaml
# Rules: references/frontend-verification.md (V-MUST-7..10, P2–P5). Prune every axis the product does not have and
# leave a one-line reason comment for each axis you keep. Placeholders are in <angle brackets>.
# Two platforms in one mission: append matrix.ios.yaml to this file as a second YAML document after a line "---".

platform: web
mission_class: "<S|M|L|XL>"
milestone: "<M1>"

environment:
  runner: playwright                    # fallback order: playwright-cli | playwright-mcp | chrome-devtools-mcp
  browsers: [chromium]                  # add webkit for Safari-heavy audiences (L/XL); firefox only if analytics justify
  container: "mcr.microsoft.com/playwright:<pinned tag>"   # goldens and accepted sets only from this environment
  base_url: "<http://localhost:3000>"
  fingerprint_fields: [os, browser_name, browser_version, device_scale_factor, fonts_hash, playwright_version]

determinism:
  animations: disabled                  # toHaveScreenshot({ animations: 'disabled' }) and CSS reduce-motion
  caret: hide
  reduced_motion: reduce
  clock: "2026-01-15T09:41:00Z"         # frozen via page.clock.setFixedTime or an app-level stub
  timezone: "UTC"
  locale: "en-US"
  seed_data: "<fixtures/seed-default.json>"
  network_stubs: "<tests/visual/stubs/>" # page.route handlers that force loading / error / empty states
  mask: ["[data-volatile]", "img.avatar", "time"]
  hide_css: "<tests/visual/hide-volatile.css>"   # passed as stylePath to toHaveScreenshot

viewports:                              # CSS px. S: keep only the reported or most-used viewport
  mobile:  { width: 375,  height: 812,  dsf: 3 }
  tablet:  { width: 768,  height: 1024, dsf: 2 }    # drop if analytics show no tablet traffic (reason required)
  desktop: { width: 1440, height: 900,  dsf: 1 }
reflow_check_only:                      # G1 geometry probe only, no screenshot (text-heavy pages)
  - { width: 320, height: 640 }

themes: [light, dark]                   # drop dark if the product has no dark mode
locales: ["en-US"]                      # localized trait: add longest-string locale or pseudo-locale, plus RTL if supported

states:                                 # defaults; each screen lists only states that exist for it
  populated: "seed-default fixture"
  empty: "stub returns zero items"
  loading: "stub holds the response; capture after skeleton renders"
  error: "stub returns 500 or aborts (offline)"
  overflow: "fixture with 200 items, very long names, non-Latin text, missing images"

screens:
  - id: "SCR-<NNN>"                     # matches .mission/design/screens/SCR-NNN.md
    name: "<dashboard>"
    route: "</dashboard>"
    hero: false                         # true → loop bound 8 and mission-worker-high maker
    ready_selector: "<[data-testid=dashboard-ready]>"
    states: [populated, empty, loading, error, overflow]
    crops: ["<[data-testid=kpi-row]>", "<table thead>", "<nav>"]
    key_screen: true                    # key screens get axe + aria snapshot + full variants
  - id: "SCR-<NNN>"
    name: "<settings>"
    route: "</settings>"
    hero: false
    ready_selector: "<main h1>"
    states: [populated, error]
    crops: ["<form>"]
    key_screen: false

g1:
  axe_tags: [wcag2a, wcag2aa, wcag21a, wcag21aa]    # add wcag22aa if the installed axe-core supports it
  aria_snapshots: true                  # toMatchAriaSnapshot per key screen
  geometry_probe: ".mission/bin/geometry-probe.js"
  min_target_css_px: 24                 # WCAG 2.2 SC 2.5.8; spacing exception reviewed by hand
  alignment_tolerance_px: 2
  max_alignment_clusters_per_column: 2
  focus_visibility: true
  token_conformance: true               # computed styles vs design/tokens.md sets
  console_errors_allowed: 0
  line_length_max_ch: 80                # article/body text on desktop
  lighthouse: false                     # true for WEB marketing/docs pages only
  suppressions_register: ".mission/verification/VERIFICATION-<M>.md#suppressions"

capture:
  frame: viewport                       # fullPage only when the page is ≤ 2 viewport heights
  scale: css                            # device scale only inside element crops
  element_crops: true
  annotated_overlay: true               # draw numbered G1 probe boxes on a copy under annotated/
  format: png
  output_dir: ".mission/verification/screens/<run-id>/"
  naming: "{id}-{state}-{viewport}-{theme}.png"       # e.g. SCR-004-empty-mobile-dark.png; append -{locale} when locales > 1
  manifest: "manifest.json"             # per file: file, scr, state, viewport, theme, locale, commit, run_id + fingerprint

budget:
  max_images_per_verifier_pass: 24      # split per screen beyond this
  iterate_on: failing_variants_only     # full matrix at milestone end

goldens:
  enabled: false                        # true only after acceptance (V-MUST-10)
  source: ".mission/verification/accepted/"
  tolerance: { max_diff_pixel_ratio: 0.001 }   # tolerance changes are reviewed like golden changes
  update_policy: "never run --update-snapshots without verifier review of every diff image; list goldens in commit"
