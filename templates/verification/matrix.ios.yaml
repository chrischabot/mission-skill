# Screenshot matrix — native iOS (SwiftUI / UIKit)
# Template: skills/mission/templates/verification/matrix.ios.yaml → .mission/verification/matrix.yaml
# Rules: references/frontend-verification.md (V-MUST-7..10, P2–P5, Shape conditionals has_ios). Prune axes the app does
# not have and leave a one-line reason comment for each axis you keep. Placeholders are in <angle brackets>.
# Two platforms in one mission: this file becomes the second YAML document (after "---") in matrix.yaml.

platform: ios
mission_class: "<S|M|L|XL>"
milestone: "<M1>"

environment:
  xcode: "<pinned version, e.g. 16.4>"
  runtime: "<iOS pinned runtime, e.g. iOS 18.5>"
  capture_via: xcuitest                 # fallback order: simctl-script | ios-simulator-mcp (>= 1.3.3)
  build_via: "<xcodebuild | XcodeBuildMCP simulator build>"
  scheme: "<AppUITests>"
  bundle_id: "<com.example.app>"
  fingerprint_fields: [macos_version, xcode_version, runtime, device_model, scale, snapshot_library_version]

determinism:
  erase_simulator_before_run: true      # xcrun simctl erase <udid> (per-lane simulator in swarms)
  status_bar: 'xcrun simctl status_bar booted override --time "9:41" --batteryState charged --batteryLevel 100'
  status_bar_reset: "xcrun simctl status_bar booted clear"
  launch_args: ["-UITestSeed", "default", "-DisableAnimations", "1"]
  launch_env: { UITEST_CLOCK: "2026-01-15T09:41:00Z" }
  locale: "en_US"
  network_stubs: "<URLProtocol stub keyed by launch argument -UITestStub>"   # forces loading / error / empty / offline

devices:                                # S: 1 device; M: small + large; L/XL: + tablet if the app supports iPad
  small: "iPhone SE (3rd generation)"
  large: "<largest iPhone in the pinned runtime, e.g. iPhone 16 Pro Max>"
  tablet: "<iPad model in the pinned runtime>"   # delete if iPhone-only (reason required)

appearance: [light, dark]               # SwiftUI screens always keep both

content_size:                           # Dynamic Type categories; confirm names with `xcrun simctl ui help`
  default: large
  accessibility: accessibility-extra-extra-extra-large
  extra_small: extra-small              # L/XL only

orientation: [portrait]                 # add landscape for iPad or media screens
locales: ["en_US"]                      # localized trait: add longest-string locale and an RTL locale if supported

states:                                 # defaults; each screen lists only states that exist for it
  populated: "-UITestSeed default"
  empty: "-UITestSeed empty"
  loading: "-UITestStub hold"
  error: "-UITestStub server-error"
  overflow: "-UITestSeed extreme (200 items, very long names, non-Latin text, portrait + landscape photos, missing images)"
  permission-denied: "privacy permission revoked via xcrun simctl privacy booted revoke <service> <bundle_id>"
  offline: "-UITestStub offline"

screens:
  - id: "SCR-<NNN>"                     # matches .mission/design/screens/SCR-NNN.md
    name: "<outfit-builder>"
    deeplink: "<myapp://outfit/new>"
    hero: true                          # true → loop bound 8 and mission-worker-high maker
    ready_identifier: "<outfitBuilder.ready>"
    states: [populated, empty, overflow, error]
    crops: ["<toolbar>", "<itemGrid>", "<saveButton>"]   # accessibility identifiers
    key_screen: true
  - id: "SCR-<NNN>"
    name: "<lookbook>"
    deeplink: "<myapp://lookbook>"
    hero: false
    ready_identifier: "<lookbook.ready>"
    states: [populated, empty, offline]
    crops: ["<grid>"]
    key_screen: true

g1:
  accessibility_audit: "performAccessibilityAudit(for: .all)"   # iOS 17+; default and accessibility sizes, light and dark
  audit_suppressions_register: ".mission/verification/VERIFICATION-<M>.md#suppressions"
  min_hit_target_pt: 44                 # buttons, links, cells: frame >= 44x44 pt or flagged
  zero_issue_types_on_key_screens: [textClipped, dynamicType]
  identifiers_unique: true
  primary_action_hittable: true
  region_order_from: "XCUITest queries or ios-simulator-mcp ui_describe_all"
  frames_inside_window: true            # safe area / off-screen check against app.windows.firstMatch.frame

capture:
  method_primary: "XCUIScreen.main.screenshot() -> XCTAttachment and PNG written to output_dir"
  method_fallback: "xcrun simctl io booted screenshot {file}"
  settings_fallback:
    appearance: "xcrun simctl ui booted appearance {light|dark}"
    content_size: "xcrun simctl ui booted content_size {category}"
  element_crops: true                   # crop by XCUIElement frame × scale
  annotated_overlay: true
  format: png
  output_dir: ".mission/verification/screens/<run-id>/"
  naming: "{id}-{state}-{device}-{appearance}-{content_size}.png"   # e.g. SCR-004-empty-small-dark-accessibility-extra-extra-extra-large.png
  manifest: "manifest.json"             # per file: file, scr, state, device, appearance, content_size, locale, commit, run_id + fingerprint

budget:
  max_images_per_verifier_pass: 24
  iterate_on: failing_variants_only

unit_snapshots:
  enabled: false                        # true only after acceptance (V-MUST-10)
  library: "pointfreeco/swift-snapshot-testing <pinned version>"
  strategies:
    - ".image(on: .iPhoneSe)"
    - "<largest phone config available in the installed library version>"
  traits: [".init(preferredContentSizeCategory: .large)", ".init(preferredContentSizeCategory: .accessibilityExtraExtraExtraLarge)"]
  record_policy: "record only from the accepted set, on the exact simulator that recorded the reference; never record: .all without verifier review"
